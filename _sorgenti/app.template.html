<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00447A">
<title>inDigo App 2.0</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#00447A; --blue-d:#00315A; --blue-l:#E8EFF6;
  --ink:#14202B; --muted:#5E6B78; --line:#E3E8EE; --bg:#F4F6F9; --card:#fff;
  --green:#1E9E5A; --red:#C8443A; --wa:#25D366;
  --r:18px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + var(--sb))}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto}

/* header */
.top{background:linear-gradient(160deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;padding:calc(18px + var(--st)) 20px 26px;border-radius:0 0 28px 28px}
.top img{display:block;height:54px;margin:4px auto 16px}
.status{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#9AA5B1}
.dot.on{background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.25)}
.dot.off{background:#FF8A80}
.status small{display:block;font-weight:500;opacity:.8;font-size:12px;margin-top:1px}
.status .chev{margin-left:auto;opacity:.7}

.navbar{position:sticky;top:0;z-index:30;background:var(--blue);padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.circ{width:42px;height:42px;border-radius:50%;background:var(--blue);border:2px solid #fff;color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25);flex:none}
.circ svg{width:20px;height:20px}
.circ:active{transform:scale(.94)}
.navbar .mlogo img{height:30px;display:block}
.top .logo-link{display:block}
.store{scroll-margin-top:calc(72px + var(--st))}
.sub-top{background:var(--blue);color:#fff;padding:6px 20px 20px;border-radius:0 0 24px 24px}
.sub-top h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub-top p{opacity:.8;font-size:14px;margin-top:4px}

section{padding:22px 16px 0}
.h2{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
.h2 h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.h2 a{font-size:13px;font-weight:700;color:var(--blue)}

/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;margin:0 -16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;scroll-snap-align:center;border-radius:22px;min-height:170px;padding:56px 20px 20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.slide .tag{position:absolute;top:16px;left:20px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px}
.slide h3{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.3px}
.slide p{font-size:14px;opacity:.9;margin-top:6px}
.slide .cta{margin-top:14px;align-self:flex-start;background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:9px 14px;border-radius:99px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:99px;background:#C9D2DC;transition:.2s}
.dots i.a{width:18px;background:var(--blue)}

/* quick */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.q{background:var(--card);border-radius:16px;padding:14px 4px 12px;text-align:center;font-size:12px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.q .ic{width:42px;height:42px;border-radius:13px;margin:0 auto 8px;display:grid;place-items:center;background:var(--blue-l);color:var(--blue)}
.q.wa .ic{background:#E3F8EC;color:#128C4B}
.ic svg{width:22px;height:22px}

/* register banner */
.reg{background:var(--card);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;border:1.5px solid var(--blue-l)}
.reg .ic{width:48px;height:48px;border-radius:14px;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.reg b{font-size:15px;display:block}
.reg span{font-size:13px;color:var(--muted)}
.reg .go{margin-left:auto;font-size:20px;color:var(--blue);font-weight:800}

/* store chips row */
.stores-row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px;scrollbar-width:none}
.stores-row::-webkit-scrollbar{display:none}
.sc{flex:0 0 158px;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 1px 0 var(--line)}
.sc .cov{height:96px;display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;padding:10px;font-size:15px;line-height:1.1;letter-spacing:.2px}
.sc .meta{padding:10px 12px 12px}
.sc .meta b{font-size:13px;display:block;line-height:1.25;min-height:32px}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.mini .dot{width:8px;height:8px}
.mini .dot.on{box-shadow:none;background:var(--green)}
.mini .dot.off{background:var(--red)}

/* shop tiles */
.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:4px;min-height:92px}
.shop .bar{width:28px;height:4px;border-radius:9px;margin-bottom:6px}
.shop b{font-size:14px}
.shop span{font-size:12px;color:var(--muted)}
.shop.main{grid-column:1/-1;background:var(--blue);color:#fff;flex-direction:row;align-items:center;min-height:0;padding:16px 18px}
.shop.main span{color:rgba(255,255,255,.8)}
.shop.main .go{margin-left:auto;font-weight:800;font-size:20px}

/* store detail cards */
.store{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.store .cov{height:118px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;position:relative}
.store .cov h3{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.store .cov small{opacity:.85;font-size:12px;font-weight:600;margin-top:3px}
.store .cov .pill{position:absolute;top:14px;right:14px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;display:flex;align-items:center;gap:6px}
.store .cov .pill .dot{width:8px;height:8px;box-shadow:none}
.store .cov .pill .dot.on{background:var(--green)}
.store .cov .pill .dot.off{background:var(--red)}
.store .body{padding:14px 16px 16px}
.row{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;color:var(--ink)}
.row svg{width:18px;height:18px;flex:none;color:var(--muted);margin-top:1px}
.row .muted{color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.act{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;font-weight:700}
.act svg{width:20px;height:20px;display:block;margin:0 auto 4px;color:var(--blue)}
.act.dis{opacity:.35;pointer-events:none}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
summary{font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.hours{width:100%;font-size:13px;margin-top:8px;border-collapse:collapse}
.hours td{padding:5px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:right;color:var(--muted)}
.hours tr.today td{font-weight:800;color:var(--ink)}
.todo{display:inline-block;font-size:11px;font-weight:700;color:#9A6B00;background:#FFF3D6;border:1px dashed #E2B54A;border-radius:6px;padding:1px 6px}

/* register page */
.why{background:var(--blue-l);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.45;color:var(--blue-d)}
.steps{counter-reset:s}
.step{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line);display:flex;gap:14px}
.step .n{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:var(--blue-l);color:var(--blue)}
.step.done .n{background:var(--green);color:#fff}
.step>div>b{font-size:15px;display:block}
.step p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff}
.btn.wa{background:var(--wa);color:#073B1E}
.btn.gh{background:var(--bg);color:var(--ink)}
.btn svg{width:16px;height:16px}
.check{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--green)}
.perks{display:grid;gap:10px}
.perk{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line);font-size:14px;font-weight:600}
.perk .e{font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.s{opacity:1;transform:translateX(-50%)}

/* contacts */
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .sw{width:10px;height:36px;border-radius:6px;flex:none}
.li b{display:block;font-size:14px}
.li span{font-size:12.5px;color:var(--muted)}
.li .r{margin-left:auto;color:var(--blue);font-weight:800;font-size:13px;white-space:nowrap}

.job{display:flex;align-items:center;gap:12px;background:linear-gradient(140deg,#00315A,#00447A 60%,#2F6FA8);color:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(0,49,90,.22)}
.job .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}.job .ic svg{width:24px;height:24px}
.job b{display:block;font-size:18px;font-weight:800}.job span{font-size:13px;opacity:.9;font-weight:600}.job .go{margin-left:auto;font-size:26px;opacity:.8}
.jb{display:flex;align-items:center;gap:14px;border-radius:20px;padding:18px;color:#fff;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.jb svg{width:30px;height:30px;flex:none}.jb b{display:block;font-size:18px;font-weight:800}.jb span{display:block;font-size:13.5px;opacity:.92;font-weight:600;margin-top:2px}
.jb.m{background:var(--blue)}.jb.w{background:#25A85A}
.jtxt{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;font-size:15px;line-height:1.5;box-shadow:0 1px 0 var(--line)}
.foot{text-align:center;padding:28px 16px 10px;font-size:13px;color:var(--muted)}
.foot a{color:var(--blue);font-weight:800;font-size:17px;display:block;margin-bottom:6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + var(--sb));display:flex;justify-content:space-around;z-index:40}
nav.tabs a{flex:1;max-width:100px;text-align:center;font-size:10.5px;font-weight:700;color:#8A96A3;padding:4px 0}
nav.tabs a svg{width:24px;height:24px;display:block;margin:0 auto 3px}
nav.tabs a.a{color:var(--blue)}
nav.tabs a.reg-tab .bub{width:46px;height:46px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:-20px auto 2px;box-shadow:0 6px 16px rgba(31,77,122,.35)}
nav.tabs a.reg-tab .bub svg{margin:0;width:24px;height:24px}
/* social row */
.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.so{background:var(--card);border-radius:16px;padding:14px 4px 12px;text-align:center;font-size:12px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.so .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff}
.so .ic svg{width:22px;height:22px}
.so.ig .ic{background:linear-gradient(45deg,#f9a13b,#e4405f 45%,#8a3ab9)}
.so.fb .ic{background:#1877F2}
.so.lk .ic{background:#0A66C2}
.so.wa .ic{background:var(--wa)}
.so.off{opacity:.45}
.so.off .ic{background:#C9D2DC!important}
.so small{display:block;font-size:10px;color:#9A6B00;font-weight:700;margin-top:2px}
.soc.two{grid-template-columns:1fr 1fr}
/* store list compact */
.sl{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.sl .th{width:74px;height:74px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;word-break:break-word;text-align:center;padding:6px;line-height:1.1}
.sl b{font-size:15px;display:block}
.sl span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.sl .go{margin-left:auto;color:var(--blue);font-size:22px;font-weight:800;padding-right:6px}
/* store page */
.hero{height:190px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;border-radius:0 0 26px 26px;position:relative}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.4px;line-height:1.05}
.hero p{opacity:.88;font-size:13px;font-weight:600;margin-top:5px}
.hero .pill{position:absolute;top:16px;right:16px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;display:flex;align-items:center;gap:6px}
.hero .pill .dot{width:8px;height:8px;box-shadow:none}
.hero .pill .dot.on{background:var(--green)}.hero .pill .dot.off{background:var(--red)}
.bigbtn{display:flex;align-items:center;gap:14px;background:var(--blue);color:#fff;border-radius:18px;padding:16px 18px}
.bigbtn .ic{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.bigbtn .ic svg{width:22px;height:22px}
.bigbtn b{font-size:16px;display:block}
.bigbtn span{font-size:12.5px;opacity:.8}
.bigbtn .go{margin-left:auto;font-size:22px;font-weight:800}
.story{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 0 var(--line)}
.story h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:8px}
.story h3 svg{width:18px;height:18px;color:var(--blue)}
.story p{font-size:14.5px;line-height:1.55;color:#33414E}
.gal{display:flex;gap:10px;overflow-x:auto;margin:14px -18px 0;padding:0 18px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 72%;aspect-ratio:4/3;border-radius:14px;object-fit:cover}
.gal img{flex:0 0 auto;height:230px;width:auto;max-width:86%;border-radius:14px;object-fit:cover;background:#111;cursor:zoom-in}
.lbx{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:14px}
.lbx img{max-width:100%;max-height:100%;border-radius:10px}
.lbx b{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;color:#fff;font-size:30px;line-height:1}
.gal .ph{background:repeating-linear-gradient(45deg,#EEF2F6,#EEF2F6 10px,#E6EBF1 10px,#E6EBF1 20px);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.gal .ph svg{width:26px;height:26px;display:block;margin:0 auto 6px}
.hero~section .act{background:var(--card);box-shadow:0 1px 0 var(--line)}
.info{background:var(--card);border-radius:18px;padding:8px 16px 14px;box-shadow:0 1px 0 var(--line)}
.wabig{display:flex;align-items:center;gap:14px;background:var(--wa);color:#073B1E;border-radius:20px;padding:16px 18px;box-shadow:0 8px 20px rgba(37,211,102,.35);animation:pulse 2.4s ease-in-out infinite}
.wabig .ic{width:50px;height:50px;border-radius:50%;background:#fff;color:#128C4B;display:grid;place-items:center;flex:none}
.wabig .ic svg{width:30px;height:30px}
.wabig b{font-size:18px;display:block;font-weight:800}
.wabig span{font-size:13px;font-weight:600;opacity:.85}
.wabig .go{margin-left:auto;font-size:26px;font-weight:800}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(37,211,102,.35)}50%{box-shadow:0 8px 28px rgba(37,211,102,.6)}}
nav.tabs a.reg-tab .bub.wa{background:var(--wa);color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.45)}
nav.tabs a.reg-tab{color:#128C4B}
.perk{align-items:flex-start}
.perk div b{display:block;font-size:15px;font-weight:800}
.perk div span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.4}
.sbn{display:grid;gap:10px}
.sb{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px;color:#fff;min-height:78px;position:relative;overflow:hidden}
.sb::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.sb .fav{width:50px;height:50px;border-radius:14px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;letter-spacing:-.3px}
.sb.main .fav{background:rgba(255,255,255,.14)}
.sb .fav img{width:42px;height:auto}
.sb .tx{flex:1;min-width:0}
.sb .tx b{display:block;font-size:15px;font-weight:800;overflow-wrap:anywhere}
.sb .tx span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.sb .cta{margin-left:auto;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:8px 12px;border-radius:99px;white-space:nowrap;position:relative;z-index:1}
.sb.main{min-height:96px}
.sb.main .tx b{font-size:19px}
.sl .th{padding:0;overflow:hidden}
.sl .th img,.sc .cov img{width:100%;height:100%;object-fit:contain;display:block}
.sc .cov{padding:0;overflow:hidden}
.hero{height:auto;min-height:200px;padding-top:24px}
.hero .hlogo{width:92px;height:92px;border-radius:20px;object-fit:cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(0,0,0,.3);margin-bottom:14px}
.sb .fav{overflow:hidden;padding:0}
.sb .fav img{width:100%!important;height:100%;object-fit:cover}
.sb.main .fav{background:none}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sg{text-align:center}
.sg .lg{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sg .lg img{width:100%;height:100%;object-fit:contain;display:block}
.sg .lg .dot{position:absolute;top:8px;right:8px;width:12px;height:12px;border:2px solid #fff;box-shadow:none}
.sg .lg .dot.on{background:var(--green)}.sg .lg .dot.off{background:var(--red)}
.sg b{display:block;font-size:12px;font-weight:700;margin-top:6px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.all .lg{background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;line-height:1.15}

.cpy{flex:none;width:62px;border:0;border-radius:14px;background:#fff;color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;cursor:pointer}.cpy svg{width:20px;height:20px}.cpy small{font-size:11px;font-weight:800}.cpy:active{transform:scale(.95)}
.csb,.pvb{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);min-width:0}
.csb svg,.pvb svg{width:22px;height:22px;flex:none;color:var(--blue)}
.csb.wa svg,.pvb.wa svg{color:#128C4B}
.csb div,.pvb div{min-width:0}
.csb b,.pvb b{display:block;font-size:13px;font-weight:800}
.csb span,.pvb span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.pv-h{display:flex;align-items:center;gap:12px}
.pv-h img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none}
.pv-h b{display:block;font-size:15px}
.pv-h span{display:block;font-size:12.5px;color:var(--muted)}
.pv-h .go{margin-left:auto;color:var(--blue);font-size:22px;font-weight:800}
.pv-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pvb{background:var(--bg)}
.pvb.dis{opacity:.4;pointer-events:none}
.perk.top{background:linear-gradient(120deg,#00315A,#00447A);color:#fff;box-shadow:0 6px 16px rgba(0,49,90,.25)}
.perk.top div b{font-size:16.5px}
.perk.top div span{color:rgba(255,255,255,.88)}
.h2 h2 svg{width:18px;height:18px;vertical-align:-3px;color:var(--blue)}
.h2 .cnt{font-size:12.5px;font-weight:700;color:var(--muted)}
.bsearch{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;margin-bottom:12px;outline:none}
.bsearch:focus{border-color:var(--blue)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bt{text-align:center}
.bt .bl{aspect-ratio:1;background:#fff;border-radius:16px;box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.05);display:grid;place-items:center;overflow:hidden;border:1.5px solid transparent;transition:.15s}
.bt:active .bl{border-color:var(--blue);transform:scale(.97)}
.bt .bl img{width:100%;height:100%;object-fit:contain;padding:5px}
.bt .bl span{font-size:13px;font-weight:800;padding:6px;line-height:1.15;color:var(--ink)}
.bt b{display:block;font-size:11.5px;font-weight:700;margin-top:5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.azbar{position:sticky;top:calc(62px + var(--st));z-index:20;display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:6px 0 10px;margin:-6px 0 4px;scrollbar-width:none}
.azbar::-webkit-scrollbar{display:none}
.azbar button{flex:none;min-width:32px;height:32px;border-radius:10px;background:#fff;font-weight:800;font-size:13px;color:var(--blue);box-shadow:0 1px 0 var(--line)}
.lsec{scroll-margin-top:calc(120px + var(--st));margin-bottom:16px}
.lt{font-size:22px;font-weight:800;color:var(--blue);margin:4px 4px 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
.view{display:none;animation:f .25s ease}
.view.a{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

const DAYS=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
function romeNow(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  const d=new Date(Date.UTC(+g("year"),+g("month")-1,+g("day")));
  return {date:d,min:(+g("hour")%24)*60+ +g("minute")};
}
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const toMin=s=>{const[h,m]=s.split(":");return +h*60+ +m};
function slotsFor(d,store){
  const k=iso(d);
  if(CONFIG.special[k]) return CONFIG.special[k];
  const wd=d.getUTCDay();
  if(wd===0){const s=CONFIG.sundayOpen; return (k>=s.from&&k<=s.to)?s.slots:[];}
  return CONFIG.week[wd].map(([a,b])=>[a,b==="SAT"?(store?store.satClose:"21:00"):b]);
}
function status(store){
  const {date,min}=romeNow();
  const today=slotsFor(date,store);
  for(const [a,b] of today){ if(min>=toMin(a)&&min<toMin(b)) return {open:true,text:"Aperto ora",sub:"Chiudiamo alle "+b}; }
  for(const [a] of today){ if(min<toMin(a)) return {open:false,text:"Chiuso",sub:"Riapriamo oggi alle "+a}; }
  for(let i=1;i<10;i++){const d=addDays(date,i),s=slotsFor(d,store); if(s.length){return {open:false,text:"Chiuso",sub:"Riapriamo "+(i===1?"domani":DAYS[d.getUTCDay()].toLowerCase())+" alle "+s[0][0]};}}
  return {open:false,text:"Chiuso",sub:""};
}
function hoursTable(store){
  const {date}=romeNow(); let h="";
  for(let i=0;i<7;i++){const d=addDays(date,i),s=slotsFor(d,store);
    const lbl=i===0?"Oggi":i===1?"Domani":DAYS[d.getUTCDay()]+" "+d.getUTCDate()+"/"+(d.getUTCMonth()+1);
    h+=`<tr class="${i===0?"today":""}"><td>${lbl} ${statusTag(s)}</td><td>${s.length?s.map(x=>x.join("–")).join(" · "):"Chiuso"}</td></tr>`;}
  return `<table class="hours">${h}</table>`;
}

/* ===================== AGGIORNAMENTO AUTOMATICO ===================== */
const APP_VERSION="__VERSION__";
let lastCheck=0, updating=false;
async function checkUpdate(force){
  if(updating) return false;
  const now=Date.now(); if(!force && now-lastCheck<15000) return false; lastCheck=now;
  try{
    const r=await fetch("version.json?t="+now,{cache:"no-store"}); if(!r.ok) return false;
    const j=await r.json();
    if(j.version && j.version!==APP_VERSION && new URL(location.href).searchParams.get("v")!==j.version){
      updating=true;
      const u=new URL(location.href); u.searchParams.set("v",j.version);
      location.replace(u.pathname+u.search+location.hash);
      return true;
    }
  }catch(e){}
  return false;
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(true); });
setInterval(()=>checkUpdate(true),120000);

/* ===================== SYNC GOOGLE CALENDAR ===================== */
let gcalStatus="local";
async function syncGoogle(){
  const g=CONFIG.googleCalendar; if(!g.id||!g.apiKey) return;
  try{
    const now=new Date(), max=new Date(now.getTime()+120*864e5);
    const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(g.id)}/events?key=${g.apiKey}&singleEvents=true&orderBy=startTime&timeMin=${new Date(now.getTime()-864e5).toISOString()}&timeMax=${max.toISOString()}&maxResults=250`;
    const r=await fetch(url); if(!r.ok) throw 0; const j=await r.json();
    (j.items||[]).forEach(ev=>{
      const d=ev.start&&(ev.start.date||(ev.start.dateTime||"").slice(0,10)); if(!d) return;
      const s=(ev.summary||"").toUpperCase();
      if(s.includes("CHIUS")) CONFIG.special[d]=[];
      else{ const m=[...s.matchAll(/(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})/g)].map(x=>[x[1].padStart(2,"0")+":"+x[2],x[3].padStart(2,"0")+":"+x[4]]); if(m.length) CONFIG.special[d]=m; }
      if(ev.description) (CONFIG.notes=CONFIG.notes||{})[d]=ev.description.replace(/<[^>]+>/g,"");
    });
    gcalStatus="google"; render();
  }catch(e){ gcalStatus="error"; }
}

let calOffset=0, calSel=null;
function dayKind(d){
  const k=iso(d), s=slotsFor(d,null), wd=d.getUTCDay();
  if(!s.length) return wd===0&&!CONFIG.special[k]?"off":"closed";
  if(CONFIG.special[k]) return "special";
  if(wd===0) return "sunday";
  return "open";
}
function vCalendario(){
  const {date:today}=romeNow();
  const first=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth()+calOffset,1));
  const y=first.getUTCFullYear(), m=first.getUTCMonth();
  const days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const lead=(first.getUTCDay()+6)%7;
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div></div>`;
  for(let n=1;n<=days;n++){
    const d=new Date(Date.UTC(y,m,n)), k=iso(d), kind=dayKind(d), past=k<iso(today);
    cells+=`<button class="cd ${kind} ${k===iso(today)?"today":""} ${k===calSel?"sel":""} ${past?"past":""}" data-day="${k}">${n}</button>`;
  }
  const sel=calSel?new Date(calSel+"T00:00:00Z"):today;
  const det=dayDetail(sel);
  const up=[]; for(let i=0;i<60&&up.length<8;i++){const d=addDays(today,i),k=iso(d),kd=dayKind(d); if(kd==="special"||kd==="sunday"||kd==="closed") up.push(d);}
  return `${navbar()}<header class="sub-top"><h1>Calendario</h1><p>Giorni di apertura e orari di tutti i negozi</p></header>
  <section>
    <div class="calbox">
      <div class="calhead"><button class="cnav" data-cal="-1" ${calOffset<=0?"disabled":""}>‹</button><b>${MONTHS[m]} ${y}</b><button class="cnav" data-cal="1" ${calOffset>=5?"disabled":""}>›</button></div>

    </div>

    <div class="list">${up.map(d=>{const s=slotsFor(d,null);return `<button class="li" data-day="${iso(d)}" style="width:100%;text-align:left"><span class="sw ${dayKind(d)}"></span><div><b>${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].toLowerCase()} ${statusTag(s)}</b><span>${s.length?s.map(x=>x.join("–")).join(" · "):"Chiuso"}</span></div></button>`}).join("")||'<div class="li"><span>Nessuna data speciale nei prossimi giorni</span></div>'}</div>

  <section><div class="why">${gcalStatus==="google"?"✅ Calendario sincronizzato con Google.":"Orari aggiornati dallo staff inDigo."} Per dubbi scrivici su WhatsApp.</div></section>`;
}
function halfTag(sl){
  if(sl.length!==1) return "";
  if(toMin(sl[0][1])<=toMin("14:30")) return '<span class="half">Solo mattina</span>';
  if(toMin(sl[0][0])>=toMin("14:00")) return '<span class="half pm">Solo pomeriggio</span>';
  return "";
}
function statusTag(sl){
  if(!sl.length) return '<span class="half cl">Chiuso</span>';
  return halfTag(sl)||'<span class="half op">Aperto</span>';
}
function dayDetail(d){
  const k=iso(d), kind=dayKind(d);
  const lbl=`${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].toLowerCase()} ${d.getUTCFullYear()}`;
  const rows=CONFIG.stores.map(s=>{const sl=slotsFor(d,s);return `<tr><td>${s.short} ${statusTag(sl)}</td><td>${sl.length?sl.map(x=>x.join("–")).join(" · "):"Chiuso"}</td></tr>`}).join("");
  const note=CONFIG.notes&&CONFIG.notes[k]?`<p class="cnote">${CONFIG.notes[k]}</p>`:"";
  return `<div class="info"><div class="dhead"><span class="sw ${kind}"></span><b>${lbl}</b></div>${note}<table class="hours">${rows}</table></div>`;
}

/* ========================= ROUTER ========================= */
const ROUTES={home:["Home",I.home,vHome],negozi:["Negozi",I.pin,vNegozi],registrati:["Registrati",I.user,vReg],calendario:["Calendario",I.cal,vCalendario],shop:["Shop",I.bag,vShop],contatti:["Contatti",I.chat,vContatti],lavora:["Lavora con noi",I.brief,vLavora]};
if(slOn()) ROUTES.shopping=["Shopping List",I.gift||I.bag,vShopping];
const TABS=["home","negozi","WA","shop","contatti"];
let keepScroll=false, pendingStore=null, depth=0, goingBack=false;
function render(){
  const r=(location.hash||"#home").slice(1);
  const sm=r.match(/^negozio-(.+)$/), bm=r.match(/^brand-(.+)$/);
  const sid=(sm&&sm[1])||(bm&&bm[1]);
  const th=sid&&(CONFIG.stores.find(x=>x.id===sid)||{}).theme;
  const rs=document.documentElement.style;
  if(th){rs.setProperty("--blue",th[0]);rs.setProperty("--blue-d",th[1]);}
  else{rs.removeProperty("--blue");rs.removeProperty("--blue-d");}
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.content=th?th[0]:"#00447A";
  const key=(sm||bm)?"negozi":(ROUTES[r]?r:"home");
  document.getElementById("app").innerHTML=`<div class="view a">${sm?vStore(sm[1]):bm?vBrands(bm[1]):ROUTES[key][2]()}</div>`;
  document.getElementById("tabs").innerHTML=TABS.map(k=>
    k==="WA"?`<a href="#registrati" class="reg-tab"><div class="bub wa">${I.wa}</div>Registrati</a>`
    :`<a href="#${k}" class="${k===key?"a":""}">${ROUTES[k][1]}${ROUTES[k][0]}</a>`).join("");
  if(key==="negozi"&&pendingStore){const el=document.getElementById("st-"+pendingStore); if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),50); pendingStore=null;}
  else if(!keepScroll) window.scrollTo(0,0);
  keepScroll=false;
  bind();
}
function bind(){
  const car=document.getElementById("car");
  if(car){const dots=[...document.querySelectorAll("#dots i")];
    car.addEventListener("scroll",()=>{const i=Math.round(car.scrollLeft/(car.firstElementChild.offsetWidth+12));dots.forEach((d,j)=>d.classList.toggle("a",i===j));},{passive:true});}
  document.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{keepScroll=true;calSel=b.dataset.day;const d=new Date(calSel+"T00:00:00Z"),t=romeNow().date;calOffset=(d.getUTCFullYear()-t.getUTCFullYear())*12+d.getUTCMonth()-t.getUTCMonth();render();const x=document.querySelector(".dhead");if(x)x.scrollIntoView({behavior:"smooth",block:"center"});}));
  document.querySelectorAll("[data-cal]").forEach(b=>b.addEventListener("click",()=>{keepScroll=true;calOffset+=+b.dataset.cal;calSel=null;render();}));
  document.querySelectorAll("[data-reg]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();openRegSheet(a.dataset.reg);}));
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{const el=document.getElementById(b.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}));
  const bs=document.querySelector("[data-bsearch]");
  if(bs) bs.addEventListener("input",()=>{const q=bs.value.trim().toLowerCase();document.querySelectorAll(".bt").forEach(x=>x.style.display=x.dataset.bn.includes(q)?"":"none");});
  const bb=document.getElementById("backBtn");
  if(bb) bb.addEventListener("click",()=>{ if(depth>0){goingBack=true;history.back();} else location.hash="#home"; });
  document.querySelectorAll("[data-home]").forEach(a=>a.addEventListener("click",e=>{ if((location.hash||"#home")==="#home"){e.preventDefault();window.scrollTo({top:0,behavior:"smooth"});} }));
  document.querySelectorAll("[data-goto]").forEach(a=>a.addEventListener("click",()=>{pendingStore=a.dataset.goto;}));
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{const v=b.dataset.copy,m=b.dataset.msg||"Numero copiato";let ok=false;try{await navigator.clipboard.writeText(v);ok=true;}catch(e){try{const ta=document.createElement("textarea");ta.value=v;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove();}catch(_){}}toast(ok?m+" ✓":v);}));
  document.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("change",()=>{store(c.dataset.k,c.checked?"1":"0");render();}));
}
window.addEventListener("hashchange",async()=>{ if(goingBack){goingBack=false;depth=Math.max(0,depth-1);} else depth++; if(await checkUpdate(false)) return; render(); });
render();
syncGoogle();
setInterval(()=>{if(!document.querySelector("details[open]"))render()},60000);
